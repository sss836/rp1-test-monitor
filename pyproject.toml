[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rp1-monitor-robot"
version = "0.4.0"
description = "Robot-only read-only observer; no desktop, web UI, AI or PostgreSQL"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.27,<1", "websockets>=15,<16", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
rp1-observer = "rp1_robot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
